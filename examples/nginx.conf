# Minimal openresty-edge config: HTTP/3 + Brotli + a hello route.
# Generate a self-signed cert for local testing:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
#     -keyout key.pem -out cert.pem -subj "/CN=localhost"
# then mount cert.pem + key.pem into the container.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/openresty/nginx.pid;

# ngx_brotli is a dynamic module — load it in the main context.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    brotli            on;
    brotli_comp_level 5;
    brotli_types      text/plain text/css application/json
                      application/javascript image/svg+xml;

    server {
        listen 443 quic reuseport;   # HTTP/3 over UDP
        listen 443 ssl;              # h1/h2 fallback over TCP
        http3 on;
        server_name _;

        ssl_certificate     /etc/openresty/cert.pem;
        ssl_certificate_key /etc/openresty/key.pem;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        location / {
            default_type text/plain;
            return 200 "openresty-edge: h3 + brotli OK\n";
        }
    }
}
