name: test

# Fast amd64 smoke test on every push / PR. Builds the image locally and
# asserts the three things that justify this image existing — HTTP/3, brotli,
# and the baked Lua libraries — actually load. A green build that can't serve
# h3 or can't require resty.acme is worse than a red one.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'patches/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'patches/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run JS actions on Node 24 now (GitHub forces this 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64, load locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: openresty-edge:test
          # Same scope as build.yml's amd64 leg so the smoke test reuses (and
          # warms) the release build's layer cache instead of recompiling.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: openresty -V shows HTTP/3
        run: |
          docker run --rm openresty-edge:test openresty -V 2>&1 | tee /tmp/v.txt
          grep -q -- '--with-http_v3_module' /tmp/v.txt

      - name: nginx uses the system OpenSSL 3.5 (apk), not a static copy
        run: |
          grep -q 'built with OpenSSL 3\.5\.' /tmp/v.txt
          docker run --rm openresty-edge:test sh -c '
            ldd /usr/local/openresty/nginx/sbin/nginx | grep libssl
            ldd /usr/local/openresty/nginx/sbin/nginx | grep -q "libssl.so.3 => /usr/lib/libssl.so.3"
            apk info -e libssl3'

      - name: brotli dynamic modules present
        run: |
          docker run --rm openresty-edge:test \
            sh -c 'ls -1 /usr/local/openresty/nginx/modules/ngx_http_brotli_*.so'

      - name: baked Lua libraries require cleanly
        run: |
          # resty CLI default path includes site/lualib (where we copied the
          # rocks) + lualib. crowdsec lives under lualib/plugins/crowdsec, so
          # add it explicitly for the require check.
          docker run --rm openresty-edge:test resty -e '
            require("resty.http")
            require("resty.acme.autossl")
            require("resty.openssl.x509")
            print("lua libs OK")'
          docker run --rm openresty-edge:test resty \
            -I /usr/local/openresty/lualib/plugins/crowdsec \
            -e 'require("crowdsec"); print("crowdsec lib OK")'

      - name: config with brotli + HTTP/3 passes nginx -t
        run: |
          cat > /tmp/test.conf <<'CONF'
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /var/run/openresty/nginx.pid;
          load_module modules/ngx_http_brotli_filter_module.so;
          load_module modules/ngx_http_brotli_static_module.so;
          events { worker_connections 256; }
          http {
            brotli on;
            brotli_types text/plain application/json;
            server {
              listen 8443 quic reuseport;
              listen 8443 ssl;
              http3 on;
              server_name _;
              ssl_certificate     /tmp/t.crt;
              ssl_certificate_key /tmp/t.key;
              location / { return 200 "ok\n"; }
            }
          }
          CONF
          # No -p: use the compiled default prefix (/usr/local/openresty/nginx),
          # so `load_module modules/...` resolves to nginx/modules/ where the
          # brotli .so lives — same path real consumer configs use.
          docker run --rm -v /tmp/test.conf:/tmp/test.conf:ro openresty-edge:test sh -c '
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout /tmp/t.key -out /tmp/t.crt -subj "/CN=test" 2>/dev/null
            openresty -c /tmp/test.conf -t'

      - name: backported nginx script fixes are in the binary (CVE-2026-42533)
        run: |
          # Reproducer from upstream commit a8289aa69c74 (part of the
          # CVE-2026-42533 series in patches/nginx/): the map regex rewrites
          # $1 between the script's length and copy passes. Unpatched nginx
          # returns 6 bytes ("1:1" + 3 bytes of garbage); patched returns "1:1".
          cat > /tmp/script.conf <<'CONF'
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /tmp/script.pid;
          events { worker_connections 64; }
          http {
            map $uri $foo { ~^/(?<bar>[0-9]).*$ $bar; }
            server {
              listen 8080;
              location ~(?<bar>[0-9]*)[a-z]*$ { return 200 $1:$foo; }
            }
          }
          CONF
          docker run --rm -v /tmp/script.conf:/tmp/script.conf:ro openresty-edge:test sh -c '
            openresty -c /tmp/script.conf && sleep 1
            curl -s http://127.0.0.1:8080/1234abcd > /tmp/body
            od -c /tmp/body
            test "$(cat /tmp/body)" = "1:1" && test "$(wc -c < /tmp/body)" -eq 3'
