name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ${{ vars.RUNS_ON_LIGHT || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned sha256)
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact -v .

  workflows:
    runs-on: ${{ vars.RUNS_ON_LIGHT || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Forgejo's medusa runner: the Docker daemon is DinD and the job workspace is a volume it cannot see, so
      # files handed to `docker run -v` must live in /ci-shared (the same path in the job and in DinD).
      # GitHub (no /ci-shared): the workspace and /tmp, as before.
      - name: Workspace the Docker daemon can see
        run: |
          d=$GITHUB_WORKSPACE
          if [ -d /ci-shared ]; then
            d=/ci-shared/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB; rm -rf "$d"; mkdir -p "$d/tmp"
            cp -a "$GITHUB_WORKSPACE/." "$d/"
            echo "TMPDIR=$d/tmp" >> "$GITHUB_ENV"
          fi
          echo "CI_WORKDIR=$d" >> "$GITHUB_ENV"

      - working-directory: ${{ env.CI_WORKDIR }}
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      # zizmor reads GitHub's API (GH_TOKEN): GitHub only.
      - if: github.server_url == 'https://github.com'
        working-directory: ${{ env.CI_WORKDIR }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1 .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove the shared copy
        if: always() && startsWith(env.CI_WORKDIR, '/ci-shared/')
        run: rm -rf "$CI_WORKDIR"

  hadolint:
    runs-on: ${{ vars.RUNS_ON_LIGHT || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Forgejo's medusa runner: the Docker daemon is DinD and the job workspace is a volume it cannot see, so
      # files handed to `docker run -v` must live in /ci-shared (the same path in the job and in DinD).
      # GitHub (no /ci-shared): the workspace and /tmp, as before.
      - name: Workspace the Docker daemon can see
        run: |
          d=$GITHUB_WORKSPACE
          if [ -d /ci-shared ]; then
            d=/ci-shared/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB; rm -rf "$d"; mkdir -p "$d/tmp"
            cp -a "$GITHUB_WORKSPACE/." "$d/"
            echo "TMPDIR=$d/tmp" >> "$GITHUB_ENV"
          fi
          echo "CI_WORKDIR=$d" >> "$GITHUB_ENV"

      - working-directory: ${{ env.CI_WORKDIR }}
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.15.1 hadolint Dockerfile

      - name: Remove the shared copy
        if: always() && startsWith(env.CI_WORKDIR, '/ci-shared/')
        run: rm -rf "$CI_WORKDIR"

  image-scan:
    runs-on: ${{ vars.RUNS_ON_LIGHT || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: local/scan:ci
          cache-from: type=gha,scope=linux-amd64
      # trivy-action's own setup clones aquasecurity/trivy with the job token, which github.com rejects on
      # Forgejo; install the same pinned release (the action's default, v0.70.0) by checksum instead.
      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tgz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin" && tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: local/scan:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Skip OpenResty's bundled POD docs (example keys, no runtime use).
          skip-dirs: /usr/local/openresty/pod
          exit-code: "1"
