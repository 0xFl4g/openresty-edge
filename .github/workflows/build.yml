name: build

# Builds and publishes the multi-arch openresty-edge image to GHCR.
#
#   main push        -> :edge, :edge-<sha>          (no SLA, for testing)
#   tag push vX.Y.Z  -> :X.Y.Z, :X.Y, :X, :latest   (release)
#   workflow_dispatch (optional tag input)          -> same as a release tag
#
# Note: this is a from-source OpenResty + quictls build. The arm64 leg runs
# under QEMU emulation and is SLOW (tens of minutes). The gha cache keeps
# subsequent builds fast as long as the version ARGs are unchanged.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version without leading v (e.g. 1.0.0). Empty = edge build.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openresty-edge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image path
        # GHCR rejects uppercase owners; ${{ github.repository_owner }} keeps
        # original case, so lowercase it explicitly.
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve tags
        id: tags
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA::7}"
          ver=""
          if [ "$REF_TYPE" = "tag" ]; then
            ver="${REF_NAME#v}"            # vX.Y.Z -> X.Y.Z
          elif [ -n "$INPUT_TAG" ]; then
            ver="$INPUT_TAG"
          fi
          if [ -n "$ver" ]; then
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release version '$ver' must be semver X.Y.Z"; exit 1
            fi
            major="${ver%%.*}"
            minor="${ver%.*}"
            tags="${IMAGE}:${ver},${IMAGE}:${minor},${IMAGE}:${major},${IMAGE}:latest"
          else
            tags="${IMAGE}:edge,${IMAGE}:edge-${sha_short}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
