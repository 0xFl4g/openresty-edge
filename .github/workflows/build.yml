name: build

# Builds and publishes the multi-arch openresty-edge image to GHCR.
#
#   main push        -> :edge, :edge-<sha>          (no SLA, for testing)
#   tag push vX.Y.Z  -> :X.Y.Z, :X.Y, :X, :latest   (release)
#   workflow_dispatch (optional tag input)          -> same as a release tag
#
# Each architecture is compiled on its OWN native GitHub runner (amd64 on
# ubuntu-24.04, arm64 on ubuntu-24.04-arm — both free for public repos), then a
# merge job assembles the multi-arch manifest. No QEMU: emulated from-source
# OpenResty + quictls compiles are brutally slow. The matrix pushes images by
# digest (untagged); the manifest gets the tags.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version without leading v (e.g. 1.0.0). Empty = edge build.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openresty-edge
  # Run JS actions on Node 24 now (GitHub forces this 2026-06-02; silences the
  # Node 20 deprecation warning without guessing per-action version bumps).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image path
        id: img
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Platform slug
        id: slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.img.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.slug.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.slug.outputs.slug }}
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Lowercase image path
        id: img
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve tags
        id: tags
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA::7}"
          ver=""
          if [ "$REF_TYPE" = "tag" ]; then
            ver="${REF_NAME#v}"
          elif [ -n "$INPUT_TAG" ]; then
            ver="$INPUT_TAG"
          fi
          if [ -n "$ver" ]; then
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release version '$ver' must be semver X.Y.Z"; exit 1
            fi
            major="${ver%%.*}"; minor="${ver%.*}"
            args="-t ${IMAGE}:${ver} -t ${IMAGE}:${minor} -t ${IMAGE}:${major} -t ${IMAGE}:latest"
          else
            args="-t ${IMAGE}:edge -t ${IMAGE}:edge-${sha_short}"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          TAG_ARGS: ${{ steps.tags.outputs.args }}
        run: |
          docker buildx imagetools create $TAG_ARGS \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: docker buildx imagetools inspect "${IMAGE}:edge" || true
